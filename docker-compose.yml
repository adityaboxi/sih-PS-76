services:
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: jansetu_ai_service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
    restart: unless-stopped
    networks:
      - jansetu_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jansetu_server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AI_SERVICE_URL=http://ai_service:4000
      - NODE_ENV=production
    depends_on:
      - ai_service
    restart: unless-stopped
    networks:
      - jansetu_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jansetu_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - jansetu_net

networks:
  jansetu_net:
    driver: bridge
